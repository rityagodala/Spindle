[project]
name = "spindle"
version = "0.1.0"
description = "Parallel exploration runtime for coding agents. Fork, scope, race, select."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ritya" }]
keywords = ["agents", "llm", "coding-agents", "parallel", "swe-bench"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "anyio>=4.3",
    "httpx>=0.27",
    "litellm>=1.40",
    "pydantic>=2.7",
    "rich>=13.7",
    "typer>=0.12",
    "tiktoken>=0.7",
    "unidiff>=0.7",
    "tree-sitter>=0.22",
    "tree-sitter-languages>=1.10",
    "gitpython>=3.1",
]

[project.optional-dependencies]
sandbox = ["docker>=7.1"]
bench = ["swebench>=2.0"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "hypothesis>=6.100",
]

[project.scripts]
spindle = "spindle.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spindle"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # handled by formatter

[tool.ruff.lint.per-file-ignores]
"src/spindle/cli.py" = ["B008"]  # Typer uses Option(...) defaults by design

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
