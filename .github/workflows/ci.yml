name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-extras
      - name: Ruff
        run: uv run ruff check src tests evals

  mypy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-extras
      - name: Mypy
        run: uv run mypy src

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-extras
      - name: Pytest
        run: uv run pytest -q
